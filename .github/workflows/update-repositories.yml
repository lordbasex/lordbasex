name: Refresh public repository catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6
      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build catalogs from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_catalog.py
      - name: Commit changed catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPOSITORIES.md REPOSITORIES.es.md REPOSITORIES.pt.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update public repository catalog [skip ci]"
            git push
          fi
